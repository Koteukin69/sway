input type:keyboard {
    xkb_layout us,ru
    xkb_options grp:win_space_toggle,grp:alt_shift_toggle
}

input type:pointer {
    accel_profile flat
    pointer_accel 0
}

input type:touchpad {
    natural_scroll enabled
    tap enabled
}

