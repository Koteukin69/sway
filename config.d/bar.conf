bar {
    position top
    tray_output none

    font pango:JetBrainsMono Nerd Font Mono 10

    status_command while date +'%Y-%m-%d %X'; do sleep 1; done
    status_command ~/.config/sway/status.sh

    colors {
        statusline #ffffff
        background #323232
        inactive_workspace #32323200 #32323200 #acacac
    }
}
